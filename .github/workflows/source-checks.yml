name: IthuteSign source checks
on:
  push:
    branches: [main, import-ithutesign-v0.12]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    name: Source unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF engine for document tests
        run: python -m pip install "PyMuPDF>=1.24,<2"
      - name: Compile Python source files
        shell: pwsh
        run: python -m compileall -q app tests
      - name: Run offline unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Report import progress (not a release approval)
        shell: pwsh
        run: |
          $required = @(
            'app/main.py',
            'app/document.py',
            'wacom-bridge/STUCapture.cs',
            'wacom-bridge/STUCapture.csproj',
            'installer/IthuteSign.iss',
            'build-release.bat'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Host "::warning::IthuteSign is not release-ready: missing $($missing.Count) required source files"
            $missing | ForEach-Object { Write-Host "  - $_" }
          } else {
            Write-Host "All required source paths are present (not proof that Windows build or tablet works)."
          }

name: IthuteSign desktop source validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  winui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore WinUI
        run: dotnet restore ithutesign-winui-v029/IthuteSign.Modern/IthuteSign.Modern.csproj -p:Platform=x64
      - name: Build WinUI
        run: dotnet build ithutesign-winui-v029/IthuteSign.Modern/IthuteSign.Modern.csproj --no-restore -c Release -p:Platform=x64
  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q ithute-sign/app ithute-sign/tests

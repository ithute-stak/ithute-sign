name: IthuteSign WinUI Windows compile
on:
  pull_request:
    paths:
      - 'ithutesign-winui-v029/IthuteSign.Modern/**'
      - '.github/workflows/ithutesign-winui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify pinned SDK
        run: dotnet --version
        working-directory: ithutesign-winui-v029/IthuteSign.Modern
      - name: Locate Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore WinUI desktop app with Visual Studio MSBuild
        run: msbuild IthuteSign.Modern.csproj /restore /t:Restore /p:Configuration=Release /p:Platform=x64 /p:BundleWacomCapture=false /v:minimal
        working-directory: ithutesign-winui-v029/IthuteSign.Modern
      - name: Compile WinUI desktop app with Visual Studio MSBuild
        run: msbuild IthuteSign.Modern.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:BundleWacomCapture=false /v:minimal
        working-directory: ithutesign-winui-v029/IthuteSign.Modern

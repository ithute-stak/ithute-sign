name: Offline Integration Windows
on:
  pull_request:
    paths:
      - 'offline-integration/**'
      - '.github/workflows/offline-integration-windows.yml'
  push:
    branches:
      - main
    paths:
      - 'offline-integration/**'
      - '.github/workflows/offline-integration-windows.yml'
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore offline-integration/tests/OfflineIntegration.Tests.csproj
      - name: Test
        run: dotnet test offline-integration/tests/OfflineIntegration.Tests.csproj -c Release --no-restore
      - name: Build
        run: dotnet build offline-integration/src/OfflineIntegration.csproj -c Release --no-restore
